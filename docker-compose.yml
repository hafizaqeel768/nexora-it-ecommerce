# Nexora IT — development environment. `docker compose up -d` starts everything:
#   app → nexora_app (Next.js dev server, http://localhost:3100)
#   db  → nexora_pg  (PostgreSQL 17, 127.0.0.1:5432)
#   mail → nexora_mailpit (Mailpit inbox for dev email, http://localhost:8025)
# Service keys (app, db) are scoped to this project; all Docker-level names carry the nexora_ prefix.
# Names and ports verified free in docs/PHASE-0-ENVIRONMENT.md. Credentials come from .env (git-ignored).
name: nexora

services:
  app:
    build: .
    image: nexora_app:dev
    container_name: nexora_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker the database is reached by container name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@nexora_pg:5432/${POSTGRES_DB:?set in .env}?schema=public
      # Dev email goes to Mailpit (src/lib/email.ts); set RESEND_API_KEY in .env to send real email instead.
      MAILPIT_URL: http://nexora_mailpit:8025
      # Email jobs (order email retries, abandoned-cart reminders) run inside the server every 15 minutes.
      JOBS_INTERVAL_MINUTES: 15
    # Regenerates the (git-ignored) Prisma client, then starts the Next.js dev server.
    command: npm run dev:docker
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:5555:5555" # Prisma Studio: docker compose exec app npm run db:studio
    volumes:
      # Source code from WSL (hot reload). node_modules and .next stay in Docker volumes,
      # so they never mix with the WSL copies.
      - .:/app
      - nexora_app_node_modules:/app/node_modules
      - nexora_app_next:/app/.next
    networks:
      - nexora_network

  db:
    image: postgres:17-alpine
    container_name: nexora_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexora_postgres_data:/var/lib/postgresql/data
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    # Local mail catcher: every email the app sends lands here, nothing reaches real inboxes.
    # Inbox: http://localhost:8025. The app sends through Mailpit's HTTP API inside nexora_network.
    image: axllent/mailpit:v1.31.2
    container_name: nexora_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - nexora_network

networks:
  nexora_network:
    name: nexora_network
    driver: bridge

volumes:
  nexora_postgres_data:
    name: nexora_postgres_data
  nexora_app_node_modules:
    name: nexora_app_node_modules
  nexora_app_next:
    name: nexora_app_next
